services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    # Overrides backend/.env so the API reaches Postgres by Docker service name `db`.
    environment:
      DATABASE_URL: postgresql://${DB_USER:-nearish}:${DB_PASSWORD:-nearish}@db:5432/${DB_NAME:-nearish}
      # Windows + bind mount: file events often don’t reach Linux; polling makes --reload reliable.
      WATCHFILES_FORCE_POLLING: "true"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command:
      - uvicorn
      - main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app

  frontend:
    build:
      context: ./frontend
      target: development
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/usr/src/app
      - frontend_node_modules:/usr/src/app/node_modules
    command:
      - sh
      - -c
      - |
        if [ ! -x node_modules/.bin/vite ]; then npm ci; fi
        exec npm run dev -- --host 0.0.0.0 --port 3000 --strictPort

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-nearish}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nearish}
      POSTGRES_DB: ${DB_NAME:-nearish}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db_data:
  frontend_node_modules:
